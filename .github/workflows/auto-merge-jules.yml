name: Auto-Merge Jules PRs
# VibecOPS — Authorized account: daniel.trejo.eclectic@gmail.com (100 tasks/day)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Check if Jules PR
        id: check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const author = pr?.user?.login || '';
            const labels = (pr?.labels || []).map(l => l.name);
            const ACTORS = ['google-labs-jules', 'julesbot', 'jules-google'];
            const isJules = ACTORS.includes(author) || labels.some(l => ['jules','vibecops','auto-merge'].includes(l));
            core.setOutput('is_jules', String(isJules));
            core.setOutput('pr_number', String(pr?.number || 0));
      - name: Grace period
        if: steps.check.outputs.is_jules == 'true'
        run: sleep 30
      - name: Merge
        if: steps.check.outputs.is_jules == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const n = parseInt('${{ steps.check.outputs.pr_number }}');
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: n });
            if (pr.state !== 'open' || pr.draft) return;
            await github.rest.pulls.merge({
              ...context.repo, pull_number: n, merge_method: 'squash',
              commit_title: `feat: ${pr.title} [Jules auto-merge]`,
              commit_message: 'Auto-merged by VibecOPS\nPrimary account: daniel.trejo.eclectic@gmail.com',
            });
            core.info(`Merged PR #${n}`);
