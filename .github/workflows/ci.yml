name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_PASSWORD: test, POSTGRES_DB: postgres }
        ports: ['5432:5432']
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r backend/requirements.txt
      - run: pytest backend/tests/ -v
        env:
          DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_secret
          GOOGLE_CLIENT_ID: test_id
          GOOGLE_CLIENT_SECRET: test_secret

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: cd frontend && npm ci
      - run: cd frontend && npx tsc --noEmit
      - run: cd frontend && npm run build
      - run: cd frontend && npm test -- --run

  auto-merge:
    needs: [backend, frontend]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Check if Jules PR
        id: check
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const author = pr?.user?.login || '';
            const labels = (pr?.labels || []).map(l => l.name);
            const ACTORS = ['google-labs-jules', 'julesbot', 'jules-google'];
            const isJules = ACTORS.includes(author) || labels.some(l => ['jules','vibecops','auto-merge'].includes(l));
            core.setOutput('is_jules', String(isJules));
      - name: Grace period
        if: steps.check.outputs.is_jules == 'true'
        run: sleep 300
      - name: Merge
        if: steps.check.outputs.is_jules == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const n = context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: n });
            if (pr.state !== 'open' || pr.draft) return;
            await github.rest.pulls.merge({
              ...context.repo, pull_number: n, merge_method: 'squash',
              commit_title: `feat: ${pr.title} [Jules auto-merge]`,
              commit_message: 'Auto-merged by VibecOPS after CI pass\nPrimary account: daniel.trejo.eclectic@gmail.com',
            });
            core.info(`Merged PR #${n}`);
